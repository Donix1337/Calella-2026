name: Pods Android app

on:
  push:
    paths:
      - "airpods-app/**"
      - ".github/workflows/pods-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pods-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airpods-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Pods.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pods-apk
          path: airpods-app/Pods.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pods-latest"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" Pods.apk \
            --target "$GITHUB_SHA" \
            --title "Pods for Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Download Pods.apk on your phone and open it to install. Built from ${GITHUB_SHA::7}."
